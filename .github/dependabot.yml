# 每周一检查依赖更新。小版本和补丁升级合成一个 PR，免得 PR 太多。
# xlsx 来自 SheetJS 官方 CDN（npm 上没有修复版），Dependabot 管不到，需要人工跟进。
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    # chromedp、cdproto 是付款浏览器的核心，0.x 的小版本也会改 API（0.23 起 Action 改成泛型，
    # 0.14 的写法编译不过）。不自动升级，要升时另开任务按新 API 改，并跑完整 paybrowser 测试。
    ignore:
      - dependency-name: github.com/chromedp/chromedp
      - dependency-name: github.com/chromedp/cdproto
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
    ignore:
      - dependency-name: xlsx
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(docker)'
