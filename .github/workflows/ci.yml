# 开 PR、推送到 master 时跑构建、测试与检查；release.yml 发版前也会调用本工作流（workflow_call）。
# 第三方 Action 都固定到提交 SHA（注释里是版本号），由 Dependabot 负责更新。
# 漏洞扫描不在这里：见 security.yml（只提醒，不卡合并和发版）。
name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum

      - name: Allow Chrome sandbox
        # Ubuntu 24.04 默认限制非特权用户命名空间，Chrome 沙箱起不来；付款引擎有用到真实 Chrome 的测试
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件没有 gofmt，请运行 gofmt -w：" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: backend

      - name: Test
        # paybrowser 每条用例都真的启动 Chrome，放在 browser-shard 里分片并行
        run: |
          mapfile -t pkgs < <(go list ./... | grep -v '/internal/paybrowser')
          # Chrome 启动卡死时把失败的用例重跑一次，见脚本开头的说明
          ../scripts/ci-go-test.sh -race "${pkgs[@]}"

  changes:
    # 判断这次要不要跑浏览器测试（paybrowser，每条用例都真的启动一次 Chrome，是最慢的一项）。
    # PR、推送到 master：只有 backend/、本文件或 scripts/ci-go-test.sh 有改动才跑，只改 VERSION、CHANGELOG、前端、文档的不跑。
    # 发版（release.yml 经 workflow_call 调用，ref 是标签）：一律跑，发版闸门不放松。
    # 判断不出来（取不到对比的提交等）时按要跑处理。
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.diff.outputs.browser }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Diff
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          run=true
          base=""
          if [[ "$REF" == refs/tags/* ]]; then
            echo "发版：浏览器测试照常跑"
          elif [ "$EVENT" = "pull_request" ]; then
            # PR 检出的是合并提交，第一个父提交就是目标分支
            base="$(git rev-parse --verify --quiet 'HEAD^1' || true)"
          elif [ "$EVENT" = "push" ] && [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi
          if [ -n "$base" ]; then
            if files="$(git diff --name-only "$base" HEAD)"; then
              echo "$files"
              if ! grep -Eq '^(backend/|\.github/workflows/ci\.yml$|scripts/ci-go-test\.sh$)' <<<"$files"; then
                run=false
              fi
            fi
          fi
          echo "browser=$run" >> "$GITHUB_OUTPUT"
          echo "跑浏览器测试：$run"

  browser-shard:
    # paybrowser 的用例按序号分成 4 份并行跑；串行一轮约 19 分钟。
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum

      - name: Allow Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Test paybrowser (shard ${{ matrix.shard }} of 4)
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 4
        run: |
          # 按名字排序后取 序号 % 份数 == 本份 的用例，四份合起来正好是全部
          go test -race -list '.*' ./internal/paybrowser/ > "$RUNNER_TEMP/all.txt"
          mapfile -t all < <(grep -E '^(Test|Example|Fuzz|Benchmark)' "$RUNNER_TEMP/all.txt" | sort)
          mapfile -t mine < <(printf '%s\n' "${all[@]}" | grep '^Test' | awk -v n="$SHARDS" -v i="$SHARD" '(NR - 1) % n == i')
          tests="$(printf '%s\n' "${all[@]}" | grep -c '^Test' || true)"
          if [ "${#all[@]}" -ne "$tests" ]; then
            echo "paybrowser 里有不是 Test 开头的用例（Example、Fuzz、Benchmark），分片不会跑它们，请改这里的分片办法" >&2
            exit 1
          fi
          if [ "${#mine[@]}" -eq 0 ]; then
            echo "这一份没有分到用例（共 $tests 条），分片办法有问题" >&2
            exit 1
          fi
          echo "共 $tests 条，本份 ${#mine[@]} 条"
          pattern="^($(IFS='|'; echo "${mine[*]}"))\$"
          # Chrome 启动卡死时把失败的用例重跑一次，见脚本开头的说明
          ../scripts/ci-go-test.sh -race -timeout 25m -run "$pattern" ./internal/paybrowser/

  backend-browser:
    # 分支保护里的必过项就是这个名字：四份都过，或者这次不用跑（见 changes），才算过。
    needs: [changes, browser-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Result
        env:
          CHANGES: ${{ needs.changes.result }}
          WANTED: ${{ needs.changes.outputs.browser }}
          SHARDS: ${{ needs.browser-shard.result }}
        run: |
          echo "changes=$CHANGES 要跑=$WANTED 分片=$SHARDS"
          [ "$CHANGES" = "success" ] || { echo "没判断出要不要跑浏览器测试" >&2; exit 1; }
          if [ "$WANTED" = "false" ] && [ "$SHARDS" = "skipped" ]; then
            echo "这次没有改后端，不跑浏览器测试"
            exit 0
          fi
          [ "$SHARDS" = "success" ] || { echo "浏览器测试没有全部通过" >&2; exit 1; }

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

  release-build:
    # 与 release.yml 相同的静态编译，平时就验证，免得发版时才发现链接失败
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum

      - name: Build static backend
        working-directory: backend
        run: bash ../scripts/build-linux-backend.sh "$RUNNER_TEMP/cdk-recharge" "0.0.0-ci"

      - name: Check static linking
        run: |
          file "$RUNNER_TEMP/cdk-recharge"
          file "$RUNNER_TEMP/cdk-recharge" | grep -Eq 'statically linked|static-pie linked'

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Allow Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (from source, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: cdk-recharge:ci
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: bash scripts/docker-smoke.sh cdk-recharge:ci

  lint-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: shellcheck
        run: shellcheck -S warning deploy/*.sh scripts/*.sh

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"

  gitleaks:
    # 只检查本仓库自己的提交，不受外部漏洞库更新影响，所以是必过项
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          bin="$(go env GOPATH)/bin/gitleaks"
          if [ "$EVENT" = "pull_request" ]; then
            # PR 只扫本次新增的提交
            "$bin" git --redact --exit-code 1 --log-opts="${BASE_SHA}..${HEAD_SHA}" .
          else
            "$bin" git --redact --exit-code 1 .
          fi
