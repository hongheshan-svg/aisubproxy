# 推送 v* 标签时发版，顺序：
#   checks（复用 ci.yml，全部测试与构建）+ guard（标签必须在 master 上，CHANGELOG 有这一版的说明）
#   → native：构建 linux/amd64 发布包，用 ed25519 签名（供后台「一键更新」与 deploy/install.sh）
#   → image：用同一个已签名的发布包构建 Docker 镜像（Dockerfile 的 release 目标），推到 GHCR
#   → publish：两者都成功后才创建 GitHub Release
# 签名私钥在仓库 Secret RELEASE_SIGNING_KEY（PEM）；公钥在 deploy/release-signing.pub.pem，
# 并内置于程序（internal/handler/selfupdate.go）。缺少 Secret 时拒绝发布未签名的包。
# 漏洞扫描不在发版必过项里（见 security.yml）：不能让外部新公布的漏洞卡住紧急修复版。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag must be on master
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "标签 ${GITHUB_REF_NAME} 指向的提交不在 master 上，拒绝发版" >&2
            exit 1
          fi

      - name: Release notes
        # CHANGELOG.md 没写这一版的说明就直接失败
        run: |
          bash scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
          cat release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  native:
    needs: [checks, guard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version from tag
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Build backend
        working-directory: backend
        run: |
          mkdir -p ../dist
          bash ../scripts/build-linux-backend.sh "$GITHUB_WORKSPACE/dist/cdk-recharge" "$(cat ../VERSION)"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/web
          cp -a dist/. ../dist/web/

      - name: Pack bundle
        run: |
          cp VERSION dist/VERSION
          # 结构与 deploy 脚本、在线升级一致：二进制 + web/ + VERSION
          tar -C dist -czf cdk-bundle-linux-amd64.tgz cdk-recharge web VERSION
          sha256sum cdk-bundle-linux-amd64.tgz | tee cdk-bundle-linux-amd64.tgz.sha256
          ls -lh cdk-bundle-linux-amd64.tgz*

      - name: Sign bundle
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "缺少 RELEASE_SIGNING_KEY secret，拒绝发布未签名的包" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release-key.pem" -rawin \
            -in cdk-bundle-linux-amd64.tgz -out "$RUNNER_TEMP/bundle.sig"
          rm -f "$RUNNER_TEMP/release-key.pem"
          # 用仓库里的公钥立即验一遍，防止 Secret 与内置公钥不是一对
          openssl pkeyutl -verify -pubin -inkey deploy/release-signing.pub.pem -rawin \
            -in cdk-bundle-linux-amd64.tgz -sigfile "$RUNNER_TEMP/bundle.sig"
          base64 -w0 "$RUNNER_TEMP/bundle.sig" > cdk-bundle-linux-amd64.tgz.sig

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: |
            cdk-bundle-linux-amd64.tgz
            cdk-bundle-linux-amd64.tgz.sha256
            cdk-bundle-linux-amd64.tgz.sig
            VERSION
          if-no-files-found: error

  image:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle

      - name: Unpack signed bundle
        # 镜像里的程序与一键升级下载的发布包是同一份；tar 保留可执行权限
        run: |
          sha256sum -c cdk-bundle-linux-amd64.tgz.sha256
          mkdir -p dist
          tar -C dist -xzf cdk-bundle-linux-amd64.tgz
          ls -l dist

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Allow Chrome sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build release image (not pushed)
        # 先构建同一个 release 目标并只加载到本机，试跑通过后才推送：
        # 与 ci.yml 里 docker 任务的冒烟测试同一份脚本，但这里测的是 release 目标（发布包里的静态程序）
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          platforms: linux/amd64
          load: true
          push: false
          tags: cdk-recharge:release-smoke

      - name: Smoke test
        run: bash scripts/docker-smoke.sh cdk-recharge:release-smoke

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: release
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  publish:
    needs: [guard, native, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle

      - name: Append Docker instructions
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          ver="$(cat VERSION)"
          {
            echo
            echo '## Docker 镜像'
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${ver}"
            echo "# 或在部署目录：CDK_VERSION=${ver} docker compose pull && docker compose up -d"
            echo '```'
          } >> release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # 正文为 CHANGELOG.md 中的这一版说明，GitHub 自动生成的提交对比附在其后
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            cdk-bundle-linux-amd64.tgz
            cdk-bundle-linux-amd64.tgz.sha256
            cdk-bundle-linux-amd64.tgz.sig
            VERSION
