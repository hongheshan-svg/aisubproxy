name: Release OTA
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          ADMIN_TOKEN_SECRET: ci-tests-only-not-a-production-secret
      - run: npm run build:ota
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.ota.gz dist/*.sha256 --verify-tag --title "GW-LINK $GITHUB_REF_NAME" --generate-notes
