# 依赖漏洞扫描：只做提醒，不拦人。
# 外部漏洞库每周都有新条目，与代码改动无关，所以不加入分支保护的必过项，release.yml 也不调用，
# 免得一个刚公布的漏洞卡住付款问题的紧急修复版。PR 上看红叉，每周定时任务失败时 GitHub 会发邮件。
name: security

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '17 1 * * 1' # 每周一 09:17（北京时间）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache-dependency-path: backend/go.sum

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: npm audit
        # 只看生产依赖的高危与严重漏洞；读锁文件即可，不用安装
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
