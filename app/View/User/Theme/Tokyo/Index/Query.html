#{include file="./Header.html"}
<main class="tokyo-query">
    <section class="tokyo-card">
        <div class="tokyo-card__head">
            <div class="tokyo-eyebrow">ORDER</div>
            <h2 class="tokyo-card__title">#{t("订单查询")}</h2>
        </div>
        <div class="tokyo-card__body">
            <form class="order-query-form tokyo-search tokyo-search--wide" role="search">
                <i class="fa-duotone fa-regular fa-receipt"></i>
                <input type="text" class="tokyo-search__input" name="keywords" value="#{$tradeNo}"
                       placeholder="#{t('订单号/联系方式')}">
                <button type="submit" class="tokyo-search__btn btn-search-query">
                    <i class="fa-duotone fa-regular fa-search"></i>#{t("查询订单")}
                </button>
            </form>
        </div>
    </section>

    <section class="order-results tokyo-card" style="display: none;">
        <div class="tokyo-card__head tokyo-card__head--line">
            <h2 class="tokyo-card__title">#{t("查询结果")}</h2>
        </div>
        <div class="tokyo-card__body">
            <div class="order-list"></div>
        </div>
    </section>

    <section class="no-results tokyo-card" style="display: none;">
        <div class="tokyo-empty">
            <i class="fa-duotone fa-regular fa-file-magnifying-glass"></i>
            <h6>#{t("未找到相关订单")}</h6>
            <p>#{t("请检查输入信息是否正确，或联系客服协助查询")}</p>
        </div>
    </section>

    <section class="loading-state tokyo-card" style="display: none;">
        <div class="tokyo-empty">
            <i class="fa-duotone fa-regular fa-spinner-third icon-spin"></i>
            <p>#{t("正在查询订单信息...")}</p>
        </div>
    </section>
</main>
#{ready("/assets/user/controller/index/query.js")}
#{include file="./Footer.html"}
