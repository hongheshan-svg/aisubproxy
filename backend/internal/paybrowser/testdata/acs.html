<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Authentication</title>
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; }
  #wrap { border: 0; width: 100%; height: 100%; display: block; }
  form { padding: 16px; }
</style>
</head>
<body>
<!--
  仿造的 3DS 验证页（测试用），由与支付页跨站的服务提供。
  ?wrap=1 时只嵌一层自身（模拟 Stripe 外框 → 发卡行 ACS 的两层 iframe），验证码框在第二层。
  验证码框没有 autocomplete="one-time-code"，另有隐藏框与不可见框，检验「框内唯一可见的文本输入框」规则。
  提交后通知支付页：验证码为 123456 时成功，否则被拒。
-->
<script>
  if (new URLSearchParams(location.search).get('wrap') === '1') {
    document.write('<iframe id="wrap" src="acs.html" title="Bank authentication"></iframe>')
  }
</script>
<form id="acs-form">
  <h2>Verify your purchase</h2>
  <p>Enter the code we sent to your phone.</p>
  <input type="hidden" name="txn" value="t-1">
  <input type="text" name="decoy" style="display:none">
  <input type="text" id="acs-code" name="code" inputmode="numeric">
  <button type="submit">Submit</button>
</form>
<script>
  var form = document.getElementById('acs-form')
  if (document.getElementById('wrap')) {
    form.remove()
  } else {
    form.addEventListener('submit', function (e) {
      e.preventDefault()
      window.top.postMessage({ type: '3ds', ok: document.getElementById('acs-code').value === '123456' }, '*')
    })
  }
</script>
</body>
</html>
