# Tag 推送 v* 时自动构建 linux/amd64 发布包、用 ed25519 签名并挂到 GitHub Release，
# 供管理后台「一键更新」与 deploy/install.sh 下载（无需生产机装 Go/Node）。
# 签名私钥在仓库 Secret RELEASE_SIGNING_KEY（PEM）；公钥在 deploy/release-signing.pub.pem，
# 并内置于程序（internal/handler/selfupdate.go）。缺少 Secret 时拒绝发布未签名的包。
# 更新说明取自 CHANGELOG.md 中与标签同名的一节（scripts/release-notes.sh）；没有这一节时拒绝发布。
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "$VER" > VERSION

      - name: Release notes
        run: |
          # 先于编译执行：CHANGELOG.md 没写这一版的说明就直接失败，不浪费构建时间
          bash scripts/release-notes.sh "${{ steps.ver.outputs.tag }}" > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Build backend
        working-directory: backend
        run: |
          mkdir -p ../dist
          bash ../scripts/build-linux-backend.sh "$GITHUB_WORKSPACE/dist/cdk-recharge" "${{ steps.ver.outputs.version }}"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/web
          cp -a dist/. ../dist/web/

      - name: Pack bundle
        run: |
          cp VERSION dist/VERSION
          # 结构与 deploy 脚本一致：二进制 + web/ + VERSION
          tar -C dist -czf "cdk-bundle-linux-amd64.tgz" cdk-recharge web VERSION
          sha256sum "cdk-bundle-linux-amd64.tgz" | tee "cdk-bundle-linux-amd64.tgz.sha256"
          ls -lh cdk-bundle-linux-amd64.tgz*

      - name: Sign bundle
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "缺少 RELEASE_SIGNING_KEY secret，拒绝发布未签名的包" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/release-key.pem" -rawin \
            -in cdk-bundle-linux-amd64.tgz -out "$RUNNER_TEMP/bundle.sig"
          rm -f "$RUNNER_TEMP/release-key.pem"
          # 用仓库里的公钥立即验一遍，防止 Secret 与内置公钥不是一对
          openssl pkeyutl -verify -pubin -inkey deploy/release-signing.pub.pem -rawin \
            -in cdk-bundle-linux-amd64.tgz -sigfile "$RUNNER_TEMP/bundle.sig"
          base64 -w0 "$RUNNER_TEMP/bundle.sig" > cdk-bundle-linux-amd64.tgz.sig

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          # 正文为 CHANGELOG.md 中的这一版说明，GitHub 自动生成的提交对比附在其后
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          files: |
            cdk-bundle-linux-amd64.tgz
            cdk-bundle-linux-amd64.tgz.sha256
            cdk-bundle-linux-amd64.tgz.sig
            VERSION
