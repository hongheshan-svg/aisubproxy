services:
  cdk:
    # 默认拉发布好的镜像；开发时从源码构建：docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/hongheshan-svg/aisubproxy:${CDK_VERSION:-latest}
    container_name: cdk-recharge
    restart: unless-stopped
    # 停止时程序先等在途付款单进入确认或结束（最多 3 分钟），再关闭 HTTP；docker 默认 10 秒就 SIGKILL，这里放宽
    stop_grace_period: 240s
    # Chrome 带沙箱运行需要创建用户命名空间，Docker 默认 seccomp 不放行 clone、unshare。
    # 这份配置 = Docker 默认配置 + 放行这两个调用；不用 unconfined，也不加 SYS_ADMIN。
    security_opt:
      - seccomp=./deploy/chrome-seccomp.json
    volumes:
      - cdk_data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      SERVER_MODE: release
      DB_PATH: /app/data/cdk_recharge.db
      WEB_DIR: /app/web
      INSTALL_MODE: ${INSTALL_MODE:-wizard}
      JWT_SECRET: ${JWT_SECRET:-}
      APP_MASTER_KEY: ${APP_MASTER_KEY:-}
      TRUSTED_PROXIES: 172.16.0.0/12
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: cdk-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      cdk:
        condition: service_healthy

volumes:
  cdk_data:
  caddy_data:
  caddy_config:
