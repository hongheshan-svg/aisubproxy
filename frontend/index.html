<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0c0c11" />
    <title>CDK Portal</title>
    <!-- 用户端不加载 Google 字体；后台皮肤的字体由 theme.ts 只在后台页面按需加载 -->
    <style>
      /* 样式表到达前的首屏底色，避免夜间模式先闪一下白 */
      /* 只给 html：body 要保持透明，否则会盖住主题的固定氛围层 */
      /* :where() 零特异性：样式表一到，各皮肤自己的底色就能覆盖它 */
      :where(html.dark) { background: #0c0c11; color: #f4f1ea; }
    </style>
    <script>
      (function () {
        try {
          // 默认：卡台新版(zovo) + 跟随系统。与 theme.ts、后端 /public/site 的默认值保持一致
          var mode = localStorage.getItem('theme-mode') || 'auto'
          var skin = localStorage.getItem('site-skin') || 'zovo'
          var dark =
            mode === 'dark' ||
            (mode === 'auto' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          // preferDark 皮肤默认暗色，减少首屏闪白
          if (skin === 'cyber' || skin === 'ember' || skin === 'noir') dark = true
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.setAttribute('data-skin', skin)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
